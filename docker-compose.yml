services:
  presentation:
    build:
      context: .
      args:
        # Same-origin /prs-api via gateway; do not bake a public :3010 client URL.
        NEXT_PUBLIC_PRS_LIVE: "0"
        NEXT_PUBLIC_PRS_PROXY_PORT: "3010"
    ports:
      - "${PRESENTATION_PORT:-3000}:3000"
    environment:
      PRS_HOST: ${PRS_HOST:-http://100.91.252.69:8080}
      PRS_PROXY_PORT: ${PRS_PROXY_PORT:-3010}
      PRS_PROXY_BIND: 127.0.0.1
      NEXT_INTERNAL_PORT: ${NEXT_INTERNAL_PORT:-3001}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
